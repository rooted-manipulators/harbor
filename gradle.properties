kotlin.code.style=official

# --- the backend, per ADR-013 ------------------------------------------------
#
# Both are read by app/build.gradle.kts into BuildConfig. Leave either blank and
# sync is simply off: SupabaseClient.configured goes false, every call returns
# without touching the network, and Harbor behaves exactly as it did before it
# had a server. That is a supported state, not a broken build.
#
# The URL is not a secret. The anon key is not one either -- Supabase protects
# rows with row-level security (see 0011), not with this key, and it is meant to
# ship inside clients. It is still left empty here rather than committed,
# because a key in git is a key nobody rotates, and because the build works
# without it while the backend is being stood up.
#
# To fill it in: Supabase dashboard, Project Settings, API, "anon public".
# Put it in ~/.gradle/gradle.properties if you would rather it stayed off this
# repo entirely -- Gradle reads project properties from there too.
harbor.supabaseUrl=https://vxtufvcpirdjtrmidter.supabase.co
harbor.supabaseAnonKey=

# --- the WhatsApp bot, per ADR-014 -------------------------------------------
#
# The WhatsApp Business number participants forward their class group messages
# to, in E.164 (+911234567890). Blank switches the offer off: the card on the
# week screen does not appear and nothing changes. Not a secret -- it is a
# number we want people to have -- but blank until one is provisioned, so a
# build cannot advertise a number that does not answer.
harbor.whatsappNumber=
